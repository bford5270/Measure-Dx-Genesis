[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdxg"
version = "0.1.0"
description = "Diagnostic safety case finding for USMC operational forces"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "PyYAML>=6.0", "requests>=2.28"]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=7.4"]

[project.scripts]
mdxg = "mdxg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
